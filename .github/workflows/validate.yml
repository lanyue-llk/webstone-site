name: Website and result submissions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  result-contract:
    name: Result submission contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: validator
          persist-credentials: false
      - name: Check out candidate data without running its code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate immutable history, next versions and public data
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -f ../validator/scripts/check-result-change.mjs ]; then
            node ../validator/scripts/check-result-change.mjs "$BASE_SHA" "$HEAD_SHA"
          else
            echo 'Bootstrapping result validation; subsequent submissions use the merged base validator.'
          fi

  copy-review:
    name: Bilingual copy review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require editorial review for changes to site copy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- 'web/app/*.tsx' 'web/components/*.tsx' 'web/lib/i18n.ts' 'web/lib/result-copy.ts' 'benchmarks/catalog.json' 'results/')
          if [ -z "$files" ]; then exit 0; fi
          jq -er '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | tr -d '\r' |
            grep -Fxi -- '- [x] Website copy reviewed in English and Chinese using the repository’s `humanizer` and `humanizer-chinese` skills.'

  website:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Serve the static export with the production Nginx configuration
        run: |
          docker run --detach --name webstone-preview \
            --publish 127.0.0.1:8080:8080 \
            --volume "$PWD/web/out:/usr/share/nginx/html:ro" \
            --volume "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine
          node scripts/check-static-preview.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check every rendered table in Chromium
        env:
          SITE_ORIGIN: http://127.0.0.1:8080
        run: npm run test:browser
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-regressions
          path: |
            test-results/
          retention-days: 14
      - name: Stop the preview container
        if: always()
        run: docker rm --force webstone-preview 2>/dev/null || true
