server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # HTML, catalogs and fixed-name reports must be re-fetched after a release.
    add_header Cache-Control "no-store" always;

    # Next.js fingerprints these assets; only successful responses are immutable.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
