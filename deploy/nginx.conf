server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # HTML, catalogs and fixed-name reports must be re-fetched after a release.
    add_header Cache-Control "no-store, max-age=0" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Surrogate-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # The current client calls this once to evict HTML cached before no-store shipped.
    # Keep cookies and storage (including language preferences) intact.
    location = /cache-reset {
        add_header Clear-Site-Data '"cache"' always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Surrogate-Control "no-store" always;
        return 204;
    }

    # Next.js fingerprints these assets; only successful responses are immutable.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
